# ============================================================
# NIFTY100 SCREENER CONFIGURATION (Sprint 3, Day 15)
# ------------------------------------------------------------
# Analyst-editable definitions for the filter engine.
# Every threshold in a preset is a dict of:
#   metric      : key from `metrics` (resolved to a DataFrame column)
#   operator    : >, >=, <, <=, ==
#   value       : numeric threshold
#
# Special behaviours configured per metric:
#   skip_financials    : D/E filter is not applied to the Financials
#                        sector (banks/NBFCs/insurers are structural
#                        leverage companies).
#   debt_free_passes   : ICR filter passes any company labelled
#                        'Debt Free' (no interest expense == infinite
#                        coverage).
# ============================================================

db_path: db/nifty100.db

metrics:
  roe:
    column: return_on_equity_pct
  de:
    column: debt_to_equity
    skip_financials: true
  fcf:
    column: free_cash_flow_cr
  revenue_cagr_5yr:
    column: revenue_cagr_5yr
  pat_cagr_5yr:
    column: pat_cagr_5yr
  eps_cagr_5yr:
    column: eps_cagr_5yr
  opm:
    column: operating_profit_margin_pct
  pe:
    column: pe_ratio
  pb:
    column: pb_ratio
  dividend_yield:
    column: dividend_yield_pct
  icr:
    column: interest_coverage
    debt_free_passes: true
  market_cap:
    column: market_cap_crore
  net_profit:
    column: net_profit
  asset_turnover:
    column: asset_turnover
  sales:
    column: sales
  dividend_payout:
    column: dividend_payout_ratio_pct
  revenue_cagr_3yr:
    column: revenue_cagr_3yr
  de_declining:
    column: de_declining

presets:
  quality_compounder:
    name: Quality Compounder
    description: High-return, low-debt, cash-generative growers
    filters:
      - metric: roe
        operator: ">"
        value: 15.0
      - metric: de
        operator: "<"
        value: 1.0
      - metric: fcf
        operator: ">"
        value: 0.0
      - metric: revenue_cagr_5yr
        operator: ">"
        value: 10.0

  value_pick:
    name: Value Pick
    description: Cheap multiples with dividend support
    filters:
      - metric: pe
        operator: "<"
        value: 20.0
      - metric: pb
        operator: "<"
        value: 4.5
      - metric: de
        operator: "<"
        value: 2.0
      - metric: dividend_yield
        operator: ">"
        value: 1.0

  growth_accelerator:
    name: Growth Accelerator
    description: Very fast profit and revenue expansion on moderate debt
    filters:
      - metric: pat_cagr_5yr
        operator: ">"
        value: 20.0
      - metric: revenue_cagr_5yr
        operator: ">"
        value: 15.0
      - metric: de
        operator: "<"
        value: 2.0

  dividend_champion:
    name: Dividend Champion
    description: Generous, covered dividends backed by cash flow
    filters:
      - metric: dividend_yield
        operator: ">"
        value: 2.0
      - metric: dividend_payout
        operator: "<"
        value: 80.0
      - metric: fcf
        operator: ">"
        value: 0.0

  debt_free_blue_chip:
    name: Debt-Free Blue Chip
    description: Practically no debt (D/E <= 0.10), profitable, very large revenue
    filters:
      - metric: de
        operator: "<="
        value: 0.10
      - metric: roe
        operator: ">"
        value: 12.0
      - metric: sales
        operator: ">"
        value: 5000.0

  turnaround_watch:
    name: Turnaround Watch
    description: Recovering growth, improving balance sheet
    filters:
      - metric: revenue_cagr_3yr
        operator: ">"
        value: 10.0
      - metric: fcf
        operator: ">"
        value: 0.0
      - metric: de_declining
        operator: "=="
        value: true